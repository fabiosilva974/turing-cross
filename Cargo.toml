[package]
name = "turing-cross"
version = "0.1.0"
edition = "2021"
authors = ["Turing Smart Screen Open Source Project"]
description = "Cross-platform driver and monitor for Turing / XuanFang 3.5 inch USB LCD smart screens"
license = "MIT"

[dependencies]
# Interface Grafica Nativa
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.29"

# Comunicacao Serial USB (COM3 no Windows / /dev/ttyACM0 no Linux)
serialport = "4.6"

# Processamento Grafico e Framebuffer
image = { version = "0.25", default-features = false, features = ["png"] }

# Leitura de Sensores de Hardware
sysinfo = "0.31"

# Configuracao e Persistencia
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Horario e Concorrencia
chrono = "0.4"
log = "0.4"
env_logger = "0.11"
